name: nutofe
description: "Nutɔfe — tailoring business management (owner app)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  intl: ^0.20.3
  material_symbols_icons: ^4.2960.0
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Plus Jakarta Sans (SIL OFL 1.1 — assets/fonts/OFL.txt), bundled so the app needs no network for fonts.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    # Fallback for characters Plus Jakarta Sans lacks — notably Ewe/Twi letters (ɔ ɛ ŋ) in the
    # brand name "Nutɔfe" and in customer names. Noto Sans latin-ext subset, SIL OFL 1.1.
    - family: NotoSansFallback
      fonts:
        - asset: assets/fonts/NotoSans-latin-ext-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-latin-ext-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSans-latin-ext-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSans-latin-ext-700.ttf
          weight: 700
