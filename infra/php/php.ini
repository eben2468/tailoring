; Nutɔfe PHP settings (dev). Production differs only in opcache.validate_timestamps=0.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
memory_limit = 256M
post_max_size = 12M
upload_max_filesize = 10M
max_execution_time = 30
date.timezone = UTC
default_charset = UTF-8
session.use_strict_mode = 1

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
; Re-check changed files at most every 2 s: on Windows bind mounts each stat() is slow and Laravel
; includes hundreds of files per request. Edits still show up within 2 s.
opcache.revalidate_freq = 2
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

; Cache resolved paths (cuts filesystem calls on the bind mount)
realpath_cache_size = 4096K
realpath_cache_ttl = 600
