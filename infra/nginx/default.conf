# Nutɔfe API — development vhost. In production the same server block sits behind TLS (443) with HSTS.
limit_req_zone $binary_remote_addr zone=nutofe_auth:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /var/www/backend/public;
    server_tokens off;
    client_max_body_size 12m;

    # Brute-force protection for login/refresh (per client IP), on top of per-account lockout in the app.
    location /api/v1/auth/ {
        limit_req zone=nutofe_auth burst=5 nodelay;
        limit_req_status 429;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        internal;
        fastcgi_pass php:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Never execute or serve any other PHP file.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"success":false,"message":"Too many requests. Please wait a moment and try again.","code":"RATE_LIMITED","errors":{}}';
    }
}
